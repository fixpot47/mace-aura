name: Build Mace Aura

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Mace Aura 26.3
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle clean build --stacktrace

      - name: Verify final jar
        run: |
          mkdir -p dist
          cp build/libs/mace-aura-1.0.2.jar dist/mace-aura.jar
          jar tf dist/mace-aura.jar | grep 'dev/fixpot47/maceaura/MaceAuraClient.class'
          jar tf dist/mace-aura.jar | grep 'fabric.mod.json'

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mace-aura-1.0.2-mc26.3
          path: dist/mace-aura.jar
